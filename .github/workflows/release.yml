name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        type: choice
        default: openvsx
        options:
          - all
          - vscode
          - openvsx

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package extension
        run: npx @vscode/vsce package --out bioviewer.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: bioviewer.vsix

  github-release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Build release notes from CHANGELOG.md
        run: node .github/scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: bioviewer.vsix

  publish-vscode-marketplace:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'vscode'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath bioviewer.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'openvsx'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Publish to Open VSX
        run: npx --yes ovsx publish bioviewer.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
