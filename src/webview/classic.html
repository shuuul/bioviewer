<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src ${cspSource} https: data: blob:; style-src ${cspSource}; script-src ${cspSource} 'nonce-${nonce}' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src ${cspSource} https: data: blob:; font-src ${cspSource}; worker-src ${cspSource} blob:;"
    />
    <title>BioViewer - Classic Mol* Viewer</title>
    <link id="molstar-skin" rel="stylesheet" type="text/css" data-light="${molstarLightCssUri}" data-dark="${molstarDarkCssUri}" />
    <link rel="stylesheet" type="text/css" href="${classicCssUri}" />
  </head>
  <body>
    <div id="root"></div>
    <script nonce="${nonce}" type="text/javascript" src="${molstarJsUri}"></script>
    <script nonce="${nonce}" type="text/javascript" src="${classicJsUri}"></script>
  </body>
</html>
